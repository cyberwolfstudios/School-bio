<!DOCTYPE html>
<html>
<head>
    <title>Schoology Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Roboto, helvetica, arial, sans-serif; }
        
        /* Video Container */
        .video-wrapper { position: relative; width: 100vw; height: 100vh; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; background-color: #000; }
        
        /* The On-Screen Text Overlay */
        .text-overlay { 
            position: absolute; 
            top: 10%; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.75); 
            color: #fff; 
            padding: 16px 32px; 
            font-size: 24px; 
            font-weight: bold; 
            border-radius: 8px; 
            border: 2px solid #ff0055;
            text-align: center; 
            z-index: 10; 
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.03); border-color: #00ffcc; }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        /* Captcha Gate layout */
        .captcha-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .captcha-box { width: 300px; height: 74px; background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; box-shadow: 0 0 4px rgba(0,0,0,0.08); }
        .captcha-left { display: flex; align-items: center; }
        .checkbox-wrapper { width: 28px; height: 28px; background: #fff; border: 2px solid #c1c1c1; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 12px; padding: 4px; box-sizing: border-box; }
        .captcha-text { font-size: 14px; color: #222; font-weight: 400; }
        .captcha-right { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .recaptcha-logo { width: 32px; height: 32px; background: url('https://gstatic.com') no-repeat; background-size: 32px; }
        .privacy-links { font-size: 8px; color: #555; margin-top: 2px; text-align: center; line-height: 1.2; }
        .privacy-links a { color: #555; text-decoration: none; }
        .checkmark { width: 5px; height: 10px; border: solid #00a85d; border-width: 0 3px 3px 0; transform: rotate(45deg); margin-bottom: 2px; display: none; }
    </style>
</head>
<body>

    <!-- CAPTCHA Container -->
    <div class="captcha-container" id="launcher">
        <div class="captcha-box">
            <div class="captcha-left">
                <div class="checkbox-wrapper" id="checkBlock" onclick="triggerPrank()">
                    <div class="checkmark" id="checkMark"></div>
                </div>
                <div class="captcha-text">I'm not a robot</div>
            </div>
            <div class="captcha-right">
                <div class="recaptcha-logo"></div>
                <div class="privacy-links">reCAPTCHA<br><a href="#">Privacy</a> - <a href="#">Terms</a></div>
            </div>
        </div>
    </div>

    <!-- Video Stage and Content Overlay -->
    <div class="video-wrapper" id="stage">
        <div class="text-overlay">You got rickrolled by Cyberwolf!</div>
        <video id="prankVideo" playsinline loop preload="auto">
            <source src="video.mp4" type="video/mp4">
            <source src="https://archive.org" type="video/mp4">
        </video>
    </div>

    <script>
        function triggerPrank() {
            document.getElementById('checkMark').style.display = 'block';
            document.getElementById('checkBlock').style.borderColor = '#00a85d';
            
            setTimeout(function() {
                document.getElementById('launcher').style.display = 'none';
                document.getElementById('stage').style.display = 'block';
                
                var video = document.getElementById('prankVideo');
                video.muted = false;
                video.load();
                video.play();
            }, 350);
        }
    </script>
</body>
</html>
