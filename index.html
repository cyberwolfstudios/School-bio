<!DOCTYPE html>
<html>
<head>
    <title>You got rickrolled by Cyberwolf!</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f9f9f9; font-family: Roboto, helvetica, arial, sans-serif; user-select: none; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        
        /* Captcha Verification Page Box Styling */
        .captcha-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .captcha-box { width: 300px; height: 74px; background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; box-shadow: 0 0 4px rgba(0,0,0,0.08); }
        .captcha-left { display: flex; align-items: center; }
        .checkbox-wrapper { width: 28px; height: 28px; background: #fff; border: 2px solid #c1c1c1; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 12px; transition: border-color 0.2s; }
        .checkbox-wrapper:hover { border-color: #b2b2b2; }
        .spinner { width: 18px; height: 18px; border: 2px solid #4d90fe; border-top-color: transparent; border-radius: 50%; display: none; animation: spin 0.8s linear infinite; }
        .captcha-text { font-size: 14px; color: #222; font-weight: 400; }
        .captcha-right { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .recaptcha-logo { width: 32px; height: 32px; background: url('https://gstatic.com') no-repeat; background-size: 32px; }
        .privacy-links { font-size: 8px; color: #555; margin-top: 2px; text-align: center; line-height: 1.2; }
        .privacy-links a { color: #555; text-decoration: none; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="captcha-container" id="launcher">
        <div class="captcha-box">
            <div class="captcha-left">
                <div class="checkbox-wrapper" id="checkBlock" onclick="triggerPrank()">
                    <div class="spinner" id="loader"></div>
                </div>
                <div class="captcha-text">I'm not a robot</div>
            </div>
            <div class="captcha-right">
                <div class="recaptcha-logo"></div>
                <div class="privacy-links">reCAPTCHA<br><a href="#">Privacy</a> - <a href="#">Terms</a></div>
            </div>
        </div>
    </div>

    <iframe id="videoPlayer" src="" allow="autoplay"></iframe>

    <script>
        function triggerPrank() {
            // Turn the checkbox border green and show a quick loading spinner for realism
            var box = document.getElementById('checkBlock');
            var loader = document.getElementById('loader');
            box.style.background = '#fff';
            box.style.borderColor = '#4d90fe';
            loader.style.display = 'block';
            
            // Wait a tiny split-second to mimic a verification check, then launch the video with audio
            setTimeout(function() {
                document.getElementById('launcher').style.display = 'none';
                var player = document.getElementById('videoPlayer');
                player.style.display = 'block';
                player.src = "https://youtube-nocookie.com";
            }, 350);
        }
    </script>
</body>
</html>
